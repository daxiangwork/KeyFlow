name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: Build release DMG
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate release mode
        id: release_mode
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$APPLE_CERTIFICATE_BASE64" ]] || missing+=(APPLE_CERTIFICATE_BASE64)
          [[ -n "$APPLE_CERTIFICATE_PASSWORD" ]] || missing+=(APPLE_CERTIFICATE_PASSWORD)
          [[ -n "$KEYCHAIN_PASSWORD" ]] || missing+=(KEYCHAIN_PASSWORD)
          [[ -n "$APPLE_API_KEY_ID" ]] || missing+=(APPLE_API_KEY_ID)
          [[ -n "$APPLE_API_ISSUER_ID" ]] || missing+=(APPLE_API_ISSUER_ID)
          [[ -n "$APPLE_API_KEY_BASE64" ]] || missing+=(APPLE_API_KEY_BASE64)

          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "mode=notarized" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "release_name=KeyFlow ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "Release mode: notarized"
          else
            echo "mode=unsigned-test" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_name=KeyFlow ${GITHUB_REF_NAME}（未公证测试版）" >> "$GITHUB_OUTPUT"
            echo "Release mode: unsigned-test"
            echo "Missing notarization secrets: ${missing[*]}"
          fi

      - name: Import Developer ID certificate
        if: steps.release_mode.outputs.mode == 'notarized'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/keyflow-developer-id.p12"
          keychain_path="$RUNNER_TEMP/keyflow.keychain"

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"

      - name: Prepare notarytool API key
        if: steps.release_mode.outputs.mode == 'notarized'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.private_keys"
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode > "$HOME/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Build, sign, notarize, and staple DMG
        if: steps.release_mode.outputs.mode == 'notarized'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          ./Scripts/package-dmg.sh
          cat > release-notes.md <<EOF
          KeyFlow ${GITHUB_REF_NAME} 已使用 Developer ID 签名，并通过 Apple 公证。

          下载后将 KeyFlow.app 拖入 Applications，首次运行仍需按系统提示授权输入监控和辅助功能。
          EOF

      - name: Build unsigned test DMG
        if: steps.release_mode.outputs.mode != 'notarized'
        env:
          KEYFLOW_SKIP_NOTARIZATION: "1"
        run: |
          set -euo pipefail

          ./Scripts/package-dmg.sh

          shopt -s nullglob
          dmgs=(dist/*.dmg)
          [[ ${#dmgs[@]} -eq 1 ]] || { echo "Expected one DMG, found ${#dmgs[@]}" >&2; exit 1; }

          version="${GITHUB_REF_NAME#v}"
          test_dmg="dist/KeyFlow-${version}-unsigned-test.dmg"
          mv "${dmgs[0]}" "$test_dmg"

          cat > release-notes.md <<'EOF'
          > 注意：这是未公证测试版，仅适合信任该开源项目的测试用户。

          当前仓库没有配置 Apple Developer Program 凭据，因此本 DMG 未完成 Apple 公证。其他 Mac 首次打开时需要在“系统设置 → 隐私与安全性”中选择“仍要打开”，随后手动授权输入监控和辅助功能。

          没有 Apple Developer Program 的用户更推荐直接从源码构建：

          ```bash
          git clone https://github.com/daxiangwork/KeyFlow.git
          cd KeyFlow
          swift build
          ./Scripts/package-app.sh
          open dist/KeyFlow.app
          ```
          EOF

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyFlow-DMG
          path: dist/*.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_mode.outputs.release_name }}
          prerelease: ${{ steps.release_mode.outputs.prerelease == 'true' }}
          body_path: release-notes.md
          files: dist/*.dmg
          fail_on_unmatched_files: true
